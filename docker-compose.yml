fti@fti-server:~/altar-app/altar-backend$ cat docker-compose.yml
version: '3.8'

services:
  api:
    build: .
    restart: always
    container_name: altar-api-prod
    ports:
      - "8000:8000" # Diakses publik/Nginx lewat port 8000
    env_file:
      - .env.production
    networks:
      - altar-network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
  dev:
    build: .
    restart: always
    container_name: altar-api-dev
    ports:
      - "8001:8000" # Di-map ke port 8001 di server Ubuntu Anda
    env_file:
      - .env.development
    networks:
      - altar-network
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
networks:
  altar-network:
    external: true
